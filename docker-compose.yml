services:

  db:
    image: postgres:16

    container_name: recipe_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipe_ai

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .

    container_name: recipe_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/recipe_ai

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: